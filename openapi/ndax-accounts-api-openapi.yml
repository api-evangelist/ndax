                  - Validating
                  - Scheduled
                  - InProgress
                  - Completed
                  - Aborting
                  - Aborted
                  - UserCancelled
                  - SysRetired
                  - UserCancelledPending
                ReportFrequency:
                  Options:
                  - onDemand
                  - Hourly
                  - Daily
                  - Weekly
                  - Monthly
                  - Annually
                intervalDuration: 316224000000000
                RequestId: adduAIKE6Ee0eGxFM+ydsg==
                lastInstanceId: AAAAAAAAAAAAAAAAAAAAAA==
                accountIds:
                - 1
      x-requires-session: true
  /GetAccountInfo:
    post:
      operationId: getAccountInfo
      summary: Get Account Info
      description: Returns detailed information about one specific account and existing on a specific Order Management System. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getaccountinfo
      x-websocket-function: GetAccountInfo
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              omsId: 0
              accountId: 0
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
      x-requires-session: true
  /GetAccountPositions:
    post:
      operationId: getAccountPositions
      summary: Get Account Positions
      description: Retrieves a list of positions (balances) for a specific user account running under a specific Order Management System. The trading day runs from UTC Midnight to UTC Midnight. Users with Trading or AccountReadOnly permission must specify an account ID with which they're associated on the Order Management System. Users with Operator permission can specify other accounts. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getaccountpositions
      x-websocket-function: GetAccountPositions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - omsId: 1
                accountId: 4
                productSymbol: BTC
                productId: 1
                amount: 0.0
                hold: 0.0
                pendingDeposits: 0.0
                pendingWithdraws: 0.0
                totalDayDeposits: 0.0
                totalMonthDeposits: 0.0
                totalYearDeposits: 0.0
                totalYearDepositNotional: 0.0
                totalDayWithdraws: 0.0
                totalMonthWithdraws: 0.0
                totalYearWithdraws: 0.0
                totalYearWithdrawNotional: 0.0
              - omsId: 1
                accountId: 4
                productSymbol: USD
                productId: 2
                amount: 0.0
                hold: 0.0
                pendingDeposits: 0.0
                pendingWithdraws: 0.0
                totalDayDeposits: 0.0
                totalMonthDeposits: 0.0
                totalYearDeposits: 0.0
                totalYearDepositNotional: 0.0
                totalDayWithdraws: 0.0
                totalMonthWithdraws: 0.0
                totalYearWithdraws: 0.0
                totalYearWithdrawNotional: 0.0
      x-requires-session: true
  /GetTreasuryProductsForAccount:
    post:
      operationId: getTreasuryProductsForAccount
      summary: Get Treasury Products For Account
      description: Returns a list of product symbols (BTC, USD, etc.) upon which the account named by AccountId is allowed to execute treasury operations. Users with Trading, Withdraw, and Deposit permission must be associated with the account named by AccountId. Users with Operator permission can request the list of treasury products for any account. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading, Withdraw, Deposit
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#gettreasuryproductsforaccount
      x-websocket-function: GetTreasuryProductsForAccount
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              AccountId: 1
              OMSId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
      x-requires-session: true
  /ScheduleTradeActivityReport:
    post:
      operationId: scheduleTradeActivityReport
      summary: Schedule Trade Activity Report
      description: Schedules a series of trade activity reports to run for a list of accounts on a single Order Management System, starting at a specific date/time, and covering a specific time duration. The reports will run periodically until canceled. Users with Trading permission can schedule reports for accounts with which they are associated; users with Operator permissions can schedule reports for any accounts. Trade Activity Reports are delivered in comma-separated-value (CSV) format. For specific CSV formatting information, see the APEX Extract CSV Data Dictionary, available from AlphaPoint. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#scheduletradeactivityreport
      x-websocket-function: ScheduleTradeActivityReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              frequency:
                Options:
                - OnDemand
                - Hourly
                - Daily
                - Weekly
                - Monthly
                - Annual
              accountIdList:
              - 1
              omsId: 1
              beginTime: '2018-08-10T04:00:00.000Z'
              intervalDuration: 10
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                RequestingUser: 1
                OMSId: 1
                reportFlavor:
                  Options:
                  - TradeActivity
                  - Transaction
                  - Treasury
                createTime: '2018-08-17T17:57:51Z'
                initialRunTime: '2018-08-10T04:00:00Z'
                intervalStartTime: '2018-08-10T04:00:00Z'
                intervalEndTime: '2018-08-10T05:00:00Z'
                RequestStatus:
                  Options:
                  - Submitted
                  - Validating
                  - Scheduled
                  - InProgress
                  - Completed
                  - Aborting
                  - Aborted
                  - UserCancelled
                  - SysRetired
                  - UserCancelledPending
                ReportFrequency:
                  Options:
                  - onDemand
                  - Hourly
                  - Daily
                  - Weekly
                  - Monthly
                  - Annually
                intervalDuration: 36000000000
                RequestId: mGzjUfylGEmqgJIxu651aQ==
                lastInstanceId: AAAAAAAAAAAAAAAAAAAAAA==
                accountIds:
                - 1
      x-requires-session: true
  /ScheduleTransactionActivityReport:
    post:
      operationId: scheduleTransactionActivityReport
      summary: Schedule Transaction Activity Report
      description: Schedules a series of transaction activity reports for a list of accounts on a single Order Management System, starting at a specific date/time, and covering a specific time interval (90 days, for example). The reports run periodically until canceled. Users with Trading permission can schedule transaction activity reports only for accounts with which they are associated; users with Operator permission can schedule transaction activity reports for any account. Transaction Activity Reports are delivered in comma-separated-value (CSV) format. For specific CSV formatting information, see the APEX Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#scheduletransactionactivityreport
      x-websocket-function: ScheduleTransactionActivityReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              frequency: 0
              accountIdList:
              - 1
              omsId: 1
              beginTime: '2018-08-10T04:00:00.000Z'
              intervalDuration: 10
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                RequestingUser: 1
                OMSId: 1
                reportFlavor: Transaction
                createTime: '2018-08-17T18:02:23Z'
                initialRunTime: '2018-08-10T04:00:00Z'
                intervalStartTime: '2018-08-10T04:00:00Z'
                intervalEndTime: '2018-08-10T05:00:00Z'
                RequestStatus: Submitted
                ReportFrequency: Hourly
                intervalDuration: 36000000000
                RequestId: I2nCtvyY8UuHsoSyrLe2QA==
                lastInstanceId: AAAAAAAAAAAAAAAAAAAAAA==
                accountIds:
                - 1
      x-requires-session: true
  /ScheduleTreasuryActivityReport:
    post:
      operationId: scheduleTreasuryActivityReport
      summary: Schedule Treasury Activity Report
      description: Schedules a series of treasury activity reports for a list of accounts on a single Order Management System, starting at a specific date/time, and covering a specific time interval. Treasury activities are non-trading transactions such as deposits and withdrawals. The reports runs periodically until canceled. A user with Trading permission may schedule reports only for accounts with which he is associated; a user with Operator permission may schedule reports for any accounts. The Treasury Activity Report itself is delivered as a comma-separated-value (CSV) file. For specific CSV formatting info Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#scheduletreasuryactivityreport
      x-websocket-function: ScheduleTreasuryActivityReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              frequency: 0
              accountIdList:
              - 1
              omsId: 1
              beginTime: '2018-08-10T04:00:00.000Z'
              intervalDuration: 10
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                RequestingUser: 1
                OMSId: 1
                reportFlavor: Treasury
                createTime: '2018-08-17T18:02:03Z'
                initialRunTime: '2018-08-10T04:00:00Z'
                intervalStartTime: '2018-08-10T04:00:00Z'
                intervalEndTime: '2018-08-10T05:00:00Z'
                RequestStatus: Submitted
                ReportFrequency: Hourly
                intervalDuration: 36000000000
                RequestId: xbsVgAuUcEyTFgf/gpWB2A==
                lastInstanceId: AAAAAAAAAAAAAAAAAAAAAA==
                accountIds:
                - 1
      x-requires-session: true
