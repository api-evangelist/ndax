openapi: 3.2.0
info:
  title: Ndax Pro Accounts API
  version: '2026-10-13'
  description: 'Generated by API Evangelist from the Ndax Pro API reference at https://apidoc.ndax.io (Slate). Ndax is built on AlphaPoint: every function is documented as a JSON payload sent inside a message frame {m,i,n,o} over wss://api.ndax.io/WSGateway/. Public functions also answer over HTTP at https://api.ndax.io:8443/AP/{FunctionName} (Ping, GetInstruments and GetProducts verified live 2026-10-13). Each path here is a documented function name; this is NOT a provider-published contract.'
  contact:
    url: https://ndax.io/support
  termsOfService: https://ndax.io/en/legal/account-agreements
  x-generated-from: documentation
  x-provenance: generated
  x-authored-by: API Evangelist
  x-generated: '2026-10-13'
  x-generator: deterministic parse of https://apidoc.ndax.io section headings, Category/Permissions/CallType lines and request/response examples (no model)
servers:
- url: https://api.ndax.io:8443/AP
  description: Ndax AlphaPoint HTTP gateway
security:
- apiKeySignature: []
tags:
- name: Accounts
paths:
  /GenerateTradeActivityReport:
    post:
      operationId: generateTradeActivityReport
      summary: Generate Trade Activity Report
      description: Creates an immediate report on historical trade activity on a specific Order Management System for a list of accounts during a specified time interval. A user with Trading permission can only generate reports for accounts with which he is associated; a user with Operator permission can generate reports for accounts associated with others. The Trade Activity Report is delivered as a comma-separated (CSV) file. For specific CSV formatting information, see the APEX Extract CSV Data Dictionary, available from AlphaPoint. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#generatetradeactivityreport
      x-websocket-function: GenerateTradeActivityReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              accountIdList:
              - 0
              omsId: 0
              startTime: '0001-01-01T05:00:00Z'
              endTime: '0001-01-01T05:00:00Z'
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                RequestingUser: 1
                OMSId: 1
                reportFlavor:
                  Options:
                  - TradeActivity
                  - Transaction
                  - Treasury
                createTime: '2018-08-17T15:34:20Z'
                initialRunTime: '2018-08-17T15:34:20Z'
                intervalStartTime: '2019-04-10T04:00:00Z'
                intervalEndTime: '2020-04-10T04:00:00Z'
                RequestStatus:
                  Options:
                  - Submitted
                  - Validating
                  - Scheduled
                  - InProgress
                  - Completed
                  - Aborting
                  - Aborted
                  - UserCancelled
                  - SysRetired
                  - UserCancelledPending
                ReportFrequency:
                  Options:
                  - onDemand
                  - Hourly
                  - Daily
                  - Weekly
                  - Monthly
                  - Annually
                intervalDuration: 316224000000000
                RequestId: Moy/IpfPA0SLUHNYt54q4w==
                lastInstanceId: AAAAAAAAAAAAAAAAAAAAAA==
                accountIds:
                - 1
      x-requires-session: true
  /GenerateTransactionActivityReport:
    post:
      operationId: generateTransactionActivityReport
      summary: Generate Transaction Activity Report
      description: Generates an immediate report on account transaction activity for a list of accounts under a single Order Management System during a specified time. A user with Trading permission can only generate reports for accounts with which he is associated; a user with Operator permission can generate reports for accounts associated with others. There can be multiple users associated with an account. The Transaction Activity Report is delivered as a comma-separated (CSV) file. For specific CSV formatting information, see the APEX Extract CSV Data Dictionary, available from AlphaPoint. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#generatetransactionactivityreport
      x-websocket-function: GenerateTransactionActivityReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              accountIdList:
              - 0
              omsId: 0
              startTime: '0001-01-01T05:00:00Z'
              endTime: '0001-01-01T05:00:00Z'
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                RequestingUser: 1
                OMSId: 1
                reportFlavor:
                  Options:
                  - TradeActivity
                  - Transaction
                  - Treasury
                createTime: '2018-08-17T15:46:07Z'
                initialRunTime: '2018-08-17T15:46:07Z'
                intervalStartTime: '2019-04-10T04:00:00Z'
                intervalEndTime: '2020-04-10T04:00:00Z'
                RequestStatus:
                  Options:
                  - Submitted
                  - Validating
                  - Scheduled
                  - InProgress
                  - Completed
                  - Aborting
                  - Aborted
                  - UserCancelled
                  - SysRetired
                  - UserCancelledPending
                ReportFrequency:
                  Options:
                  - onDemand
                  - Hourly
                  - Daily
                  - Weekly
                  - Monthly
                  - Annually
                intervalDuration: 316224000000000
                RequestId: +QgyhnEFqEazyZ46Q902MA==
                lastInstanceId: AAAAAAAAAAAAAAAAAAAAAA==
                accountIds:
                - 1
      x-requires-session: true
  /GenerateTreasuryActivityReport:
    post:
      operationId: generateTreasuryActivityReport
      summary: Generate Treasury Activity Report
      description: Generates an immediate report on all company treasury activities related to the trading venue — those withdrawals, transfers, and funds movements that are unrelated to specific trades — over a specified period. A user with Trading permission can only generate reports for accounts with which he is associated; a user with Operator permission can generate reports for accounts associated with others. There can be multiple users associated with an account. The Trade Activity Report is delivered as a comma-separated (CSV) file. For specific CSV formatting information, see the APEX Extract CSV Data D Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#generatetreasuryactivityreport
      x-websocket-function: GenerateTreasuryActivityReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              accountIdList:
              - 0
              omsId: 0
              startTime: '0001-01-01T05:00:00Z'
              endTime: '0001-01-01T05:00:00Z'
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                RequestingUser: 1
                OMSId: 1
                reportFlavor:
                  Options:
                  - TradeActivity
                  - Transaction
                  - Treasury
                createTime: '2018-08-17T15:38:59Z'
                initialRunTime: '2018-08-17T15:38:59Z'
                intervalStartTime: '2019-04-10T04:00:00Z'
                intervalEndTime: '2020-04-10T04:00:00Z'
                RequestStatus:
                  Options:
