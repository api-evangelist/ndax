      x-requires-session: true
  /GetWithdrawTickets:
    post:
      operationId: getWithdrawTickets
      summary: Get Withdraw Tickets
      description: Returns a limited array of withdrawal tickets from the specified Order Management System and account. GetWithdrawTickets is usable with Operator and Trading permissions. It returns tickets from a single account. A similar call, GetAllWithdrawTickets, can be used only with Operator permission and returns tickets from all accounts. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Tickets
      x-category: System
      x-permissions: Operator, Trading
      x-call-type: Synchronous
