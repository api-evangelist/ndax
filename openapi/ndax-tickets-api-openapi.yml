  /GetWithdrawTicketAttachment:
    post:
      operationId: getWithdrawTicketAttachment
      summary: Get Withdraw Ticket Attachment
      description: Retrieves an attachment from a withdrawal ticket. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Tickets
      x-category: System
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getwithdrawticketattachment
      x-websocket-function: GetWithdrawTicketAttachment
      requestBody:
