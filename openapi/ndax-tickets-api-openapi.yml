              OperatorId: 1
              AccountId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - assetManagerId: 0
                accountId: 0
                assetId: 0
                assetName: null
                amount: 0.0
                omsId: 0
                requestCode: ''
                requestIP: ''
                requestUser: 0
                requestUserName: ''
                operatorId: 0
                Status: 0
                feeAmt: 0.0
                updatedByUser: 0
                updatedByUserName: ''
                ticketNumber: 0
                depositInfo: null
                createdTimestamp: '0001-01-01T00:00:00'
                lastUpdateTimeStamp: '0001-01-01T00:00:00'
                comments: null
                attachments: null
      x-requires-session: true
  /GetWithdrawFee:
    post:
      operationId: getWithdrawFee
      summary: Get Withdraw Fee
      description: Gets an estimate of a fee for a withdrawal. The Products function of the AlphaPoint Admin can set withdraw fees OMS-wide. You can also set a withdraw fee programmatically using SetOMSFee, but SetOMSFee is a System (not User) call with permission reserved to an exchange operator. Exchange-wide withdrawal fees cannot be overridden. A user with Trading or Withdraw permissions can obtain withdrawal fee estimates only for products and accounts with which the user is associated; a user with Operator permission can obtain withdrawal fee estimates for any product or account. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Tickets
      x-category: User
      x-permissions: Operator, Trading, Withdraw
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getwithdrawfee
      x-websocket-function: GetWithdrawFee
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              AccountId: 1
              ProductId: 1
              Amount: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                FeeAmount: 1.06
      x-requires-session: true
  /GetWithdraws:
    post:
      operationId: getWithdraws
      summary: Get Withdraws
      description: Returns a list of withdrawals for a given account ID. Users with Trading permission can return withdrawals only for an account with which they are associated; users with Operator permission can return withdrawals for any account. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Tickets
      x-category: System
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getwithdraws
      x-websocket-function: GetWithdraws
      requestBody:
