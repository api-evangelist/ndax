          content:
            application/json:
              schema: {}
      x-requires-session: true
  /SubmitDepositTicketComment:
    post:
      operationId: submitDepositTicketComment
      summary: Submit Deposit Ticket Comment
      description: Creates a comment and attaches that comment to a specific deposit ticket. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
