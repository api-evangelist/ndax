          description: Function reply payload.
          content:
            application/json:
              schema: {}
      x-requires-session: true
  /GetWithdrawTicket:
    post:
      operationId: getWithdrawTicket
      summary: Get Withdraw Ticket
      description: Returns a single withdrawal ticket that matches all values in the Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
