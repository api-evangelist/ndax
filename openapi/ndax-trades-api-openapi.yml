tags:
- name: Trades
paths:
  /GetAccountTrades:
    post:
      operationId: getAccountTrades
      summary: Get Account Trades
      description: Requests the details on up to 200 past trade executions for a single specific account and Order Management System, starting at index i , where i is an integer identifying a specific execution in reverse order; that is, the most recent execution has an index of 0, and increments by one as trade executions recede into the past. Users with Trading or AccountReadOnly permission may access trade information only for accounts with which they are associated; users with Operator permission may access trade information for any account. The operator of the trading venue determines how long to retain an Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Trades
      x-category: User
      x-permissions: Operator, Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getaccounttrades
      x-websocket-function: GetAccountTrades
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 0
              AccountId: 0
              StartIndex: 0
              Count: 0
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - omsId: 0
                executionId: 0
                tradeId: 0
                orderId: 0
                accountId: 0
                subAccountId: 0
                clientOrderId: 0
                instrumentId: 0
                side: 0
                quantity: 0.0
                remainingQuantity: 0.0
                price: 0.0
                value: 0.0
                tradeTime: 0
                counterParty: null
                orderTradeRevision: 0
                direction: 0
                isBlockTrade: false
                tradeTimeMS: 0
                fee: 0.0
                feeProductId: 0
                orderOriginator: 0
      x-requires-session: true
  /GetAccountTransactions:
    post:
      operationId: getAccountTransactions
      summary: Get Account Transactions
      description: 'Returns a list of transactions for a specific account on an Order Management System. The owner of the trading venue determines how long to retain order history before archiving. The caller must be associated with the account named in AccountId . Note: In this call, “Depth” refers not to the depth of the order book, but to the count of trades to report. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).'
      tags:
      - Trades
      x-category: User
      x-permissions: Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getaccounttransactions
      x-websocket-function: GetAccountTransactions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              AccountId: 1
              Depth: 200
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - transactionId: 0
                omsId: 0
                accountId: 0
                cr: 0.0
                dr: 0.0
                counterparty: 0
                transactionType: 0
                referenceId: 0
                referenceType: 0
                productId: 0
                balance: 0.0
                timeStamp: 0
      x-requires-session: true
  /GetOpenTradeReports:
    post:
      operationId: getOpenTradeReports
      summary: Get Open Trade Reports
      description: Retrieves an array of open trade information for the account named in AccountId . Users with Trading or AccountReadOnly permission must be associated with the named account; users with Operator permission can retrieve open trade reports on any account. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Trades
      x-category: User
      x-permissions: Operator, Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getopentradereports
      x-websocket-function: GetOpenTradeReports
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              AccountId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - Side: Buy
                OrderId: 0
                Price: 0.0
                Quantity: 0.0
                DisplayQuantity: 0.0
                Instrument: 0
                Account: 0
                OrderType: Unknown
                ClientOrderId: 0
                OrderState: Unknown
                ReceiveTime: 0
                ReceiveTimeTicks: 0
                OrigQuantity: 0.0
                QuantityExecuted: 0.0
                AvgPrice: 0.0
                CounterPartyId: 0
                ChangeReason: Unknown
                OrigOrderId: 0
                OrigClOrdId: 0
                EnteredBy: 0
                IsQuote: false
                InsideAsk: 0.0
                InsideAskSize: 0.0
                InsideBid: 0.0
                InsideBidSize: 0.0
                LastTradePrice: 0.0
                RejectReason: ''
                IsLockedIn: false
                CancelReason: ''
                OMSId: 0
      x-requires-session: true
  /GetTickerHistory:
    post:
      operationId: getTickerHistory
      summary: Get Ticker History
      description: Requests a ticker history (high, low, open, close, volume, bid, ask, ID) of a specific instrument from a given date to the present. You will need to format the returned data per your requirements. Because permission is Public, any user can retrieve the ticker history for any instrument on the OMS.
      tags:
      - Trades
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#gettickerhistory
      x-websocket-function: GetTickerHistory
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              InstrumentId: 1
              Interval: 60
              FromDate: '2018-07-18'
              ToDate: '2018-07-19'
              OMSId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
  /GetTradesHistory:
    post:
      operationId: getTradesHistory
      summary: Get Trades History
      description: 'Retrieves a list of trades for a specified account, order ID, user, instrument, or starting and ending time stamp. The returned list begins at start index i, where i is an integer identifying a specific trade in reverse order; that is, the most recent trade has an index of 0. “Depth” is the count of trades to report backwards from StartIndex . Users with Trading permission can retrieve trade history for accounts with which they are associated; users with Operator permission can retrieve trade history for any account. Caution : You must coordinate *StartIndex*, *Depth*, *StartTimeStamp*, and *E Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).'
      tags:
      - Trades
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#gettradeshistory
      x-websocket-function: GetTradesHistory
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              omsId: 0
              accountId: 0
              instrumentId: 0
              tradeId: 0
              orderId: 0
              userId: 0
              startTimestamp: 0
              endTimestamp: 0
              depth: 100
              startIndex: 0
              executionId: 0
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - omsId: 0
                executionId: 0
                tradeId: 0
                orderId: 0
                accountId: 0
                subAccountId: 0
                clientOrderId: 0
                instrumentId: 0
                side: 0
                quantity: 0.0
                remainingQuantity: 0.0
                price: 0.0
                value: 0.0
                tradeTime: 0
                counterParty: null
                orderTradeRevision: 0
                direction: 0
                isBlockTrade: false
                tradeTimeMS: 0
                fee: 0.0
                feeProductId: 0
                orderOriginator: 0
      x-requires-session: true
