      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                Count: 0
      x-requires-session: true
  /GetUserAffiliateTag:
    post:
      operationId: getUserAffiliateTag
      summary: Get User Affiliate Tag
      description: Returns an array of affiliate tags associated with the identified user. The exchange can use an affiliate tag to identify new
        users who join the exchange as a result of a recommendation from the identified user. A user may have multiple affiliate tags. Requires
        an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getuseraffiliatetag
      x-websocket-function: GetUserAffiliateTag
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              userId: 0
              omsId: 0
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - omsId: 0
                userId: 0
                affiliateId: 0
                affiliateTag: ''
      x-requires-session: true
  /GetUserReportTickets:
    post:
      operationId: getUserReportTickets
      summary: Get User Report Tickets
      description: Returns an array of user report tickets for a specific user ID. A user report ticket identifies a report requested or subscribed
        to by a user. Reports can run once or periodically. Requires an authenticated session; the documentation states authentication happens
        over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getuserreporttickets
      x-websocket-function: GetUserReportTickets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              UserId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
      x-requires-session: true
  /GetUserReportWriterResultRecords:
    post:
      operationId: getUserReportWriterResultRecords
      summary: Get User Report Writer Result Records
      description: 'The call returns an array of user report writer results. The results are the details of when reports have been run and the
        status of each report run. Users with Trading permission can request user report writer result records only for their own user IDs; users
        with Operator permission can request any user''s report writer result records. Note: "Depth" in this call is the count of records to be
        returned, not market depth. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway
        (wss://api.ndax.io/WSGateway/).'
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getuserreportwriterresultrecords
      x-websocket-function: GetUserReportWriterResultRecords
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              userId: 0
              depth: 50
              startIndex: 0
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
              - RequestingUser: 1
                urtTicketId: mGzjUfylGEmqgJIxu651aQ==
                descriptorId: 47TlpPQyTkKR4LKl9Hy1yA==
                resultStatus: SuccessComplete
                reportExecutionStartTime: '2018-08-17T17:57:56Z'
                reportExecutionCompleteTime: '2018-08-17T17:57:57Z'
                reportOutputFilePathname: ''
                reportDescriptiveHeader: TradeActivity|onDemand|2018-08-10T04:00:00.000Z|2018-08-10T05:00:00.000Z|2018-08-17T17:57:51.852Z|2018-08-17T17:57:56.840Z|0.19634
                  seconds
      x-requires-session: true
  /LogOut:
    post:
      operationId: logOut
      summary: Log Out
      description: LogOut ends the current websocket session.
      tags:
      - Users
      x-category: Authentication
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#logout
      x-websocket-function: LogOut
      requestBody:
        required: false
        content:
