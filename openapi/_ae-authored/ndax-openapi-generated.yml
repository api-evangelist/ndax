  /UpdateUserAffiliateTag:
    post:
      operationId: updateUserAffiliateTag
      summary: Update User Affiliate Tag
      description: Updates the user affiliate tag with new or revised information. An affiliate tag allows a user to encourage others to join
        the exchange and provides a way to track those new members back to the initiating user. Requires an authenticated session; the documentation
        states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#updateuseraffiliatetag
      x-websocket-function: UpdateUserAffiliateTag
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              omsId: 0
              userId: 0
              affiliateId: 0
              affiliateTag: ''
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                result: true
                errormsg: ''
                errorcode: 0
                detail: ''
      x-requires-session: true
  /GenerateTradeActivityReport:
    post:
      operationId: generateTradeActivityReport
      summary: Generate Trade Activity Report
      description: Creates an immediate report on historical trade activity on a specific Order Management System for a list of accounts during
        a specified time interval. A user with Trading permission can only generate reports for accounts with which he is associated; a user with
        Operator permission can generate reports for accounts associated with others. The Trade Activity Report is delivered as a comma-separated
        (CSV) file. For specific CSV formatting information, see the APEX Extract CSV Data Dictionary, available from AlphaPoint. Requires an
        authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Accounts
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#generatetradeactivityreport
      x-websocket-function: GenerateTradeActivityReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              accountIdList:
              - 0
              omsId: 0
              startTime: '0001-01-01T05:00:00Z'
              endTime: '0001-01-01T05:00:00Z'
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                RequestingUser: 1
                OMSId: 1
                reportFlavor:
                  Options:
                  - TradeActivity
                  - Transaction
                  - Treasury
                createTime: '2018-08-17T15:34:20Z'
                initialRunTime: '2018-08-17T15:34:20Z'
                intervalStartTime: '2019-04-10T04:00:00Z'
                intervalEndTime: '2020-04-10T04:00:00Z'
                RequestStatus:
                  Options:
                  - Submitted
                  - Validating
                  - Scheduled
