            schema:
              type: object
            example: {}
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
  /SubscribeAccountEvents:
    post:
      operationId: subscribeAccountEvents
      summary: Subscribe Account Events
      description: 'Subscribes the user to notifications about the status of account-level events: orders, trades, position updates, deposits,
        and withdrawals for a specific account on the Order Management System (OMS). The subscription reports all events associated with a given
        account; there is no filter at the call level to subscribe to some events and not others. Account event information is supplied in comma-separated-value
        (CSV) format. For specific CSV formatting information, see the APEX Extract CSV Data Dictionary, available from AlphaPoint. Requires an
        authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).'
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#subscribeaccountevents
      x-websocket-function: SubscribeAccountEvents
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              AccountId: 1
              OMSId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                Subscribe: true
      x-requires-session: true
  /SubscribeLevel1:
    post:
      operationId: subscribeLevel1
      summary: Subscribe Level1
      description: Retrieves the latest Level 1 Ticker information and then subscribes the user to ongoing Level 1 market data event updates for
        one specific instrument. The SubscribeLevel1 call responds with the Level 1 response shown below. The OMS then periodically sends in the
        same format as this response Leve1UpdateEvent information when best-bid/best-offer issue, until you send the UnsubscribeLevel1 call.
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#subscribelevel1
      x-websocket-function: SubscribeLevel1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              InstrumentId: 0
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                OMSId: 1
                Symbol: BTCUSD
  /SubscribeLevel2:
    post:
      operationId: subscribeLevel2
      summary: Subscribe Level2
      description: 'Retrieves the latest Level 2 Ticker information and then subscribes the user to Level 2 market data event updates for one
        specific instrument. Level 2 allows the user to specify the level of market depth information on either side of the bid and ask. The SubscribeLevel2
        call responds with the Level 2 response shown below. The OMS then periodically sends Level2UpdateEvent information in the same format
        as this response until you send the UnsubscribeLevel2 call. Note: Depth in this call is "depth of market," the number of buyers and sellers
        at greater or lesser prices in the order book for the i'
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#subscribelevel2
      x-websocket-function: SubscribeLevel2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
  /SubscribeTicker:
    post:
      operationId: subscribeTicker
      summary: Subscribe Ticker
      description: Subscribes a user to a Ticker Market Data Feed for a specific instrument and interval. SubscribeTicker sends a response object
        as described below, and then periodically returns a TickerDataUpdateEvent that matches the content of the response object.
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#subscribeticker
      x-websocket-function: SubscribeTicker
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              InstrumentId: 1
              Interval: 60
              IncludeLastCount: 100
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
  /SubscribeTrades:
    post:
      operationId: subscribeTrades
      summary: Subscribe Trades
      description: 'Subscribes to the Trades Market Data Feed for a specific instrument. No authentication is required. Each trade has two sides:
        Buy and Sell . SubscribeTrades returns the response documented here for your immediate information, then periodically sends the OrderTradeEvent
        documented in SubscribeAccountEvents.'
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#subscribetrades
      x-websocket-function: SubscribeTrades
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              InstrumentId: 1
              IncludeLastCount: 100
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
  /UnsubscribeLevel1:
    post:
      operationId: unsubscribeLevel1
      summary: Unsubscribe Level1
      description: Unsubscribes the user from a Level 1 Market Data Feed subscription.
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#unsubscribelevel1
      x-websocket-function: UnsubscribeLevel1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              InstrumentId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                result: true
                errormsg: null
                errorcode: 0
                detail: null
  /UnsubscribeLevel2:
    post:
      operationId: unsubscribeLevel2
      summary: Unsubscribe Level2
      description: Unsubscribes the user from a Level 2 Market Data Feed subscription.
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#unsubscribelevel2
      x-websocket-function: UnsubscribeLevel2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              InstrumentId: 1
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                result: true
                errormsg: null
                errorcode: 0
                detail: null
  /UnsubscribeTicker:
    post:
      operationId: unsubscribeTicker
      summary: Unsubscribe Ticker
      description: Unsubscribes the user from a Ticker Market Data Fee.
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#unsubscribeticker
      x-websocket-function: UnsubscribeTicker
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              InstrumentId: 1
      responses:
        '200':
