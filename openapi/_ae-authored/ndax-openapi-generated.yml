openapi: 3.1.0
info:
  title: Ndax Pro API
  version: '2026-10-13'
  description: 'Generated by API Evangelist from the Ndax Pro API reference at https://apidoc.ndax.io (Slate). Ndax is built on AlphaPoint: every
    function is documented as a JSON payload sent inside a message frame {m,i,n,o} over wss://api.ndax.io/WSGateway/. Public functions also answer
    over HTTP at https://api.ndax.io:8443/AP/{FunctionName} (Ping, GetInstruments and GetProducts verified live 2026-10-13). Each path here is
    a documented function name; this is NOT a provider-published contract.'
  contact:
    url: https://ndax.io/support
  termsOfService: https://ndax.io/en/legal/account-agreements
  x-generated-from: documentation
  x-provenance: generated
  x-authored-by: API Evangelist
  x-generated: '2026-10-13'
  x-generator: deterministic parse of https://apidoc.ndax.io section headings, Category/Permissions/CallType lines and request/response examples
    (no model)
servers:
- url: https://api.ndax.io:8443/AP
  description: Ndax AlphaPoint HTTP gateway
tags:
- name: Users
- name: Accounts
- name: Trades
- name: OMS Orders
- name: Products
- name: Instruments
- name: Tickets
- name: Miscellaneous
paths:
  /Activate2FA:
    post:
      operationId: activate2FA
      summary: Activate2FA
      description: Activate2FA
      tags:
      - Users
      x-category: Activation
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#activate2fa
      x-websocket-function: Activate2FA
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              Code: YourCode
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                Activated: true
                Error: ErrorMessage
  /AddUserAffiliateTag:
    post:
      operationId: addUserAffiliateTag
      summary: Add User Affiliate Tag
      description: Associates a user affiliate tag to a user. An affiliate tag allows a user to encourage others to join the exchange and provides
        a way to track those new members back to the initiating user. Requires an authenticated session; the documentation states authentication
        happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#adduseraffiliatetag
      x-websocket-function: AddUserAffiliateTag
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              omsId: 0
              userId: 0
              affiliateId: 0
              affiliateTag: ''
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                result: true
                errormsg: ''
                errorcode: 0
                detail: ''
      x-requires-session: true
  /Authenticate2FA:
    post:
      operationId: authenticate2FA
      summary: Authenticate2FA
      description: Authenticate2FA
      tags:
      - Users
      x-category: Authentication
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#authenticate2fa
      x-websocket-function: Authenticate2FA
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
  /AuthenticateUser:
    post:
      operationId: authenticateUser
      summary: Authenticate User
      description: AuthenticateUser
      tags:
      - Users
      x-category: Authentication
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#authenticateuser
      x-websocket-function: AuthenticateUser
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              UserName: ''
              Password: ''
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                APIKey: 28c68ac3fcfafc3d4e8d653fe57e5baf
                Signature: 29c15c42e4fabcc9e229421e148e647903927c503ab4578ada55bb13a63a9636
                UserId: '96'
                Nonce: '2247733562'
  /CancelUserReport:
    post:
      operationId: cancelUserReport
      summary: Cancel User Report
      description: You can generate or schedule a variety of reports through this API on demand. This call cancels a scheduled report by its report
        ID. GetUserReportTickets can provide a list of GUIDs for scheduled reports. Requires an authenticated session; the documentation states
        authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: Users
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#canceluserreport
      x-websocket-function: CancelUserReport
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                result: true
                errormsg: ''
                errorcode: 0
                detail: ''
      x-requires-session: true
  /EnableXP2FA:
    post:
      operationId: enableXP2FA
      summary: EnableXP2FA
      description: EnableXP2FA is a custom two-factor-authentication scheme (like Google 2FA). It generates 2FA code and has the ability to verify
        these codes. Requires an authenticated session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#enablexp2fa
      x-websocket-function: EnableXP2FA
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              Phone: ''
              Capability: ''
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
              example:
                Enabled2FA: true
                Activate2FA: true
      x-requires-session: true
  /GetL2Snapshot:
    post:
      operationId: getL2Snapshot
      summary: GetL2 Snapshot
      description: Provides a current Level 2 snapshot of a specific instrument trading on an Order Management System to a user-determined market
        depth. The Level 2 snapshot allows the user to specify the level of market depth information on either side of the bid and ask. Depth
        in this call is "depth of market," the number of buyers and sellers at greater or lesser prices in the order book for the instrument.
      tags:
      - Users
      x-category: User
      x-permissions: Public
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getl2snapshot
      x-websocket-function: GetL2Snapshot
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
            example:
              OMSId: 1
              InstrumentId: 1
              Depth: 100
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
  /GetUserAccountInfos:
    post:
      operationId: getUserAccountInfos
      summary: Get User Account Infos
      description: Returns a list of account information for all accounts belonging to the specified user. Requires an authenticated session;
        the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getuseraccountinfos
      x-websocket-function: GetUserAccountInfos
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
      x-requires-session: true
  /GetUserAccounts:
    post:
      operationId: getUserAccounts
      summary: Get User Accounts
      description: Returns a list of account IDs for a given user. More than one user may be associated with a given account. Requires an authenticated
        session; the documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading, AccountReadOnly
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getuseraccounts
      x-websocket-function: GetUserAccounts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Function reply payload.
          content:
            application/json:
              schema: {}
      x-requires-session: true
  /GetUserAffiliateCount:
    post:
      operationId: getUserAffiliateCount
      summary: Get User Affiliate Count
      description: Gets a count of users who have been referred to the exchange by the identified user. Requires an authenticated session; the
        documentation states authentication happens over the WebSocket gateway (wss://api.ndax.io/WSGateway/).
      tags:
      - Users
      x-category: User
      x-permissions: Operator, Trading
      x-call-type: Synchronous
      x-docs-url: https://apidoc.ndax.io/#getuseraffiliatecount
