summary: Sessions are authenticated with the AuthenticateUser call over the WebSocket gateway wss://api.ndax.io/WSGateway/, either with UserName + Password or with APIKey + Signature + UserId + Nonce; the docs state AuthenticateUser cannot be used over HTTP and the returned SessionToken is used for the rest of the session. Two-factor authentication is handled by Authenticate2FA.
